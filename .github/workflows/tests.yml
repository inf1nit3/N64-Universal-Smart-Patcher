name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core engine suite: pure stdlib, runs everywhere.
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package with the archive extra
        run: pip install -e ".[archive]" pytest pytest-cov
      - name: Run test suite (synthetic ROMs, no game files needed)
        run: python -m pytest --cov=n64patcher --cov-report=term-missing

  # A clean install must not pull in PyQt6 or py7zr - the engine is stdlib only.
  no-optional-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with no extras
        run: pip install -e .
      - name: Engine imports and runs without optional dependencies
        run: |
          python - <<'PY'
          import sys
          import n64patcher
          from n64patcher import cli  # CLI must work without PyQt6 too
          assert "PyQt6" not in sys.modules, "core import pulled in PyQt6"
          assert "py7zr" not in sys.modules, "core import pulled in py7zr"
          print("clean import OK, version", n64patcher.__version__)
          PY
      - name: CLI entry point responds
        run: n64patcher --version

  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint/type tooling
        run: pip install -e ".[archive]" ruff mypy
      - name: ruff
        run: python -m ruff check .
      # `ruff format` is deliberately NOT enforced: adopting it rewrites
      # ~1000 lines across the tree and should land as its own commit
      # rather than mixed into functional changes.
      - name: mypy
        run: python -m mypy

  # GUI import check with the full dependency stack.
  gui-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with all extras
        run: pip install -e ".[all]"
      - name: Import GUI and CLI modules
        run: |
          python -c "import n64patcher.gui"
          python -c "import n64patcher.cli"

  # The wheel must actually contain the bundled helper tools and patches;
  # a missing package-data glob only shows up at runtime otherwise.
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Verify bundled assets are present in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = ["N64noAAPatcher/additionals/", "N64noAAPatcher/hires_patches/"]
          for prefix in need:
              hits = [n for n in names if prefix in n]
              assert hits, f"wheel is missing {prefix}"
              print(f"{prefix}: {len(hits)} files")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
